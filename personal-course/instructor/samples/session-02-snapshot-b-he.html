<!doctype html>
<html lang="he" dir="rtl">

    <style>
      body{font-family:system-ui,sans-serif;line-height:1.6;max-width:54rem;margin:0 auto;padding:1.5rem;color:#17242D}
      h1{border-bottom:3px solid #4E356F;padding-bottom:.4rem}
      .sample{background:#F1F3F6;border-inline-start:4px solid #7B4FB3;padding:.75rem 1rem;border-radius:4px}
      section{border:1px solid #d6dae0;border-radius:8px;padding:1rem 1.25rem;margin:1.25rem 0}
      .tag{display:inline-block;background:#F0EAFA;color:#4E356F;border-radius:999px;padding:.15rem .7rem;font-size:.85rem;margin-bottom:.5rem}
      table{border-collapse:collapse;width:100%;margin:.6rem 0}
      th,td{border:1px solid #d6dae0;padding:.45rem .6rem;text-align:start}
      th{background:#F0EAFA;color:#4E356F}
      footer{margin-top:2rem;font-size:.85rem;color:#5a6570}
    </style>
  </head>
  <body>
    <main>
      <p class="sample"><strong>חומר להדגמת הסוכן בלבד.</strong> תמונת מצב ב׳: אותו דף מוצר בנקודת זמן מאוחרת יותר. הנתונים בדיוניים.</p>
      <section>
        <span class="tag">תמונת מצב ב׳</span>
        <h1>AquaSilent AS-640</h1>
        <table>
          <tr><th>שדה</th><th>ערך</th></tr>
          <tr><td>עלות כוללת</td><td id="v-total">2,950</td></tr>
          <tr><td>זמינות</td><td id="v-avail">במלאי</td></tr>
          <tr><td>תנאי החזרה</td><td id="v-returns">14 יום</td></tr>
          <tr><td>נקרא ב־</td><td id="v-read">14 במאי, 14:00</td></tr>

    <script>
      // עקיפה למנחה: הוסיפו ?total=2950 (או &avail= / &returns= ) כדי לשנות
      // את הקריאה בשידור חי, בלי לפרוס מחדש — למשל כדי להפעיל את הסף באמצע ההדגמה.
      (function(){
        var q=new URLSearchParams(location.search), touched=false;
        function set(id,key){ if(q.has(key)){ document.getElementById(id).textContent=q.get(key); touched=true; } }
        set('v-total','total'); set('v-avail','avail'); set('v-returns','returns');
        if(touched){ var d=new Date(); document.getElementById('v-read').textContent=d.toLocaleString(); }
      })();
    </script>
